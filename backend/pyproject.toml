[project]
name = "sec-assess-backend"
version = "0.1.0"
description = "自动化安全评估系统后端：项目接入、沙箱、多阶段流水线与报告"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "bcrypt>=4.2.0",
    "docker>=7.1.0",
    "fastapi>=0.116.0",
    "langgraph>=1.2.21",
    "openai>=1.60.0",
    "pip>=26.3",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.11.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: 需要本机 Docker 已启动且沙箱镜像已构建",
    "network: 需要访问 PyPI 等外部网络",
]
